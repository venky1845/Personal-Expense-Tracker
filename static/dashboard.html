<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .bar-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }
        .bar-item { display: flex; flex-direction: column; gap: 6px; }
        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            color: var(--cream-dim);
        }
        .bar-label span:last-child { color: var(--gold-hi); font-weight: 600; }
        .bar-track {
            width: 100%;
            height: 7px;
            background: rgba(201,168,76,0.10);
            border-radius: 99px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi));
            transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
        }
        .recent-table { margin-top: 12px; }
        .recent-table table { margin-top: 0; }
    </style>
</head>
<body onload="loadDashboard()">
<div class="container" style="width: min(720px, 100%);">

    <div class="nav-actions">
        <div class="page-brand" style="margin-bottom:0;">
            <div class="brand-icon">◈</div>
            <span class="brand-label">Personal Expense Tracker</span>
        </div>
        <button class="ghost" onclick="logoutUser()">Sign Out</button>
    </div>

    <h1 id="welcome">Welcome back</h1>

    <div class="cards" style="margin-top:24px; grid-template-columns: repeat(auto-fit, minmax(130px,1fr));">
        <div class="card">
            <h3>Total Spent</h3>
            <p id="totalAmount">—</p>
        </div>
        <div class="card">
            <h3>Highest Expense</h3>
            <p id="highestExpense">—</p>
        </div>
        <div class="card">
            <h3>No. of Expenses</h3>
            <p id="totalExpenses">—</p>
        </div>
        <div class="card">
            <h3>Categories Used</h3>
            <p id="totalCategories">—</p>
        </div>
    </div>

    <div style="margin-top:32px;">
        <div class="section-label">Category Breakdown</div>
        <div class="bar-row" id="categories"></div>
    </div>

    <div style="margin-top:32px;">
        <div class="section-label">Recent Expenses</div>
        <div class="recent-table">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="recentTable"></tbody>
            </table>
        </div>
    </div>

    <div style="margin-top:28px; text-align:right;">
        <a href="/expenses-page">
            <button>Manage Expenses →</button>
        </a>
    </div>
</div>
<script src="index.js"></script>
</body>
</html>
