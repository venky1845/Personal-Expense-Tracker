<!DOCTYPE html>
<html lang="en">
<head>
    <title>Expenses — Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .edit-btn {
            background: transparent !important;
            border: 1px solid rgba(201,168,76,0.40) !important;
            color: #c9a84c !important;
            box-shadow: none !important;
        }
        .edit-btn:hover {
            background: rgba(201,168,76,0.10) !important;
            border-color: rgba(201,168,76,0.70) !important;
            box-shadow: 0 2px 10px rgba(201,168,76,0.18) !important;
            transform: none !important;
        }
    </style>
</head>
<body onload="loadExpenses()">
<div class="container" style="width: min(780px, 100%);">

    <div class="nav-actions">
        <div class="page-brand" style="margin-bottom:0;">
            <div class="brand-icon">◈</div>
            <span class="brand-label">Personal Expense Tracker</span>
        </div>
        <a href="dashboard.html"><button class="ghost">← Dashboard</button></a>
    </div>

    <h2>Expense Manager</h2>
    <p style="margin-bottom:24px;">Add and manage your spending records.</p>

    <input type="hidden" id="expenseId">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 16px;">
        <input type="text"   id="title"    placeholder="Title">
        <input type="number" id="amount"   placeholder="Amount (₹)">
        <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Health</option>
            <option>Education</option>
            <option>Entertainment</option>
            <option>Other</option>
        </select>
        <input type="date"   id="date">
    </div>

    <input type="text" id="note" placeholder="Note (optional)">
    <div style="display:flex; gap:12px;">
        <button class="full" onclick="saveExpense()" id="saveBtn">Save Expense</button>
        <button class="ghost" id="cancelBtn" onclick="cancelEdit()" style="display:none; margin-top:8px; padding:14px 24px;">Cancel</button>
    </div>

    <hr>

    <div class="section-label" style="margin-top:24px;">All Expenses</div>

    <div class="filter-row">
        <select id="filterCategory">
            <option value="">All Categories</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Health</option>
            <option>Education</option>
            <option>Entertainment</option>
            <option>Other</option>
        </select>
        <input type="date" id="filterFrom" style="margin-bottom:0; flex:1;">
        <input type="date" id="filterTo"   style="margin-bottom:0; flex:1;">
        <button onclick="filterExpenses()">Filter</button>
        <button class="ghost" onclick="clearFilter()" style="margin-top:0;">Clear</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="expenseTable"></tbody>
    </table>
</div>
<script src="index.js"></script>
</body>
</html>
